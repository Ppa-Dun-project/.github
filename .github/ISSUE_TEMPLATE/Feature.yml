name: ✨ Feature
description: New user-facing feature
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature are you proposing?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: Related
      description: Link any related issues (e.g. org/repo#123)
    validations:
      required: false
